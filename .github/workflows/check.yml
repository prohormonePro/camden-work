name: Isolated public checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event.repository.private == false
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Run isolated source tests
        run: python -B -m unittest discover -s tests -v
      - name: Validate scoped claim references
        run: python -B tools/check_claims.py
      - name: Validate generated local documentation
        run: python -B tools/check_docs.py
      - name: Install pinned build tool
        run: python -m pip install --disable-pip-version-check setuptools==80.9.0
      - name: Build offline and verify installed challenge
        run: python -B tools/ci_installed_check.py
